<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Alumnos</title>
    <meta name="referrer" content="no-referrer">
    <link rel="shortcut icon" href="./evaluation.png" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
</head>
<header>
        <h1>se asignaran calificaciones según las notas de los alumnos</h1>
</header>
<body>

    <ul>
        <li>LUIS RAMIZ</li>

        <li>XIMENA RAMZ</li>
        <li>ROMINA RAMZ</li>

    <label for="nombre">Nombre(s):</label>
    <input type="text" id="nombre" name="nombre" maxlength="100"><br><br>

    <label for="apellidoP">Apellido Paterno:</label>
    <input type="text" id="apellidoP" name="apellidoP" maxlength="100"><br><br>

    <label for="apellidoM">Apellido Materno:</label>
    <input type="text" id="apellidoM" name="apellidoM" maxlength="100"><br><br>

    <label for="nota1">Escribe tu nota 1:</label>
    <input type="number" id="nota1" name="nota1" min="0" max="100"><br><br>

    <label for="nota2">Escribe tu nota 2:</label>
    <input type="number" id="nota2" name="nota2" min="0" max="100"><br><br>

    <label for="nota3">Escribe tu nota 3:</label>
    <input type="number" id="nota3" name="nota3" min="0" max="100"><br><br>

    <button onclick="calcularPromedio()">Calcular Promedio</button>
<br><br>
    <script src="./main.js"></script>

    <h2 id="resultado" role="status" aria-live="polite"></h2>
